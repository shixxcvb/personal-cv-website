<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pennyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadowPenny" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#pennyGrad)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 45)" filter="url(#shadowPenny)">
    <rect width="1080" height="660" rx="16" fill="#FFFFFF"/>
    
    <!-- Top Chrome -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1064 0 C 1072.84 0 1080 7.16 1080 16 L 1080 48 L 0 48 Z" fill="#F8FAFC"/>
    <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="24" r="6" fill="#27C93F"/>
    
    <rect x="120" y="10" width="840" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="140" cy="24" r="4" fill="#10B981"/>
    <text x="156" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" font-weight="500">https://penny-wise-r4rc.vercel.app</text>
    <text x="940" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Live App</text>

    <!-- App Nav -->
    <rect x="0" y="48" width="1080" height="60" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="48" cy="78" r="14" fill="#059669"/>
    <text x="42" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">₱</text>
    <text x="74" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#0F172A" font-weight="700">Penny<tspan fill="#059669">Wise</tspan></text>
    
    <text x="240" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669" font-weight="600">Dashboard</text>
    <rect x="238" y="96" width="68" height="3" rx="1.5" fill="#059669"/>
    <text x="340" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" font-weight="500">Transactions</text>
    <text x="455" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" font-weight="500">Budgets</text>
    <text x="545" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" font-weight="500">Analytics</text>
    
    <rect x="910" y="62" width="140" height="32" rx="8" fill="#ECFDF5"/>
    <text x="926" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#065F46" font-weight="600">+ Add Expense</text>

    <!-- 3 Summary Metric Cards -->
    <g transform="translate(36, 126)">
      <!-- Total Balance -->
      <rect x="0" y="0" width="316" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="500">Total Net Balance</text>
      <text x="24" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#0F172A" font-weight="800">₱24,850.00</text>
      <text x="24" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#059669" font-weight="600">↑ 12% saved vs last month</text>

      <!-- Monthly Budget -->
      <rect x="346" y="0" width="316" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="370" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="500">Monthly Spending Budget</text>
      <text x="370" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#0F172A" font-weight="800">₱8,420 / ₱15,000</text>
      <rect x="370" y="80" width="268" height="6" rx="3" fill="#F1F5F9"/>
      <rect x="370" y="80" width="150" height="6" rx="3" fill="#10B981"/>

