        <text x="245" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9D174D" text-anchor="middle" font-weight="600">₱1.5k</text>
        <text x="245" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Tech &amp; Sub</text>

        <!-- Bar 4: Transport -->
        <rect x="320" y="190" width="50" height="70" rx="6" fill="#3B82F6"/>
        <text x="345" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1E40AF" text-anchor="middle" font-weight="600">₱950</text>
        <text x="345" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Commute</text>

        <!-- Bar 5: Savings -->
        <rect x="420" y="50" width="50" height="210" rx="6" fill="#10B981"/>
        <text x="445" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46" text-anchor="middle" font-weight="600">₱5.0k</text>
        <text x="445" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Savings</text>

        <line x1="0" y1="260" x2="490" y2="260" stroke="#CBD5E1" stroke-width="1"/>
      </g>

      <!-- Right: Recent Activity -->
