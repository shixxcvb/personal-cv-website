      <text x="610" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0F172A" font-weight="700">Recent Transactions</text>

      <!-- Item 1 -->
      <rect x="610" y="60" width="374" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="636" cy="90" r="14" fill="#EDE9FE"/>
      <text x="630" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7C3AED">💻</text>
      <text x="660" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0F172A" font-weight="600">VS Code &amp; Domain Renewal</text>
      <text x="660" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Academic Tools · Yesterday</text>
      <text x="960" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#DC2626" font-weight="700" text-anchor="end">-₱540.00</text>

      <!-- Item 2 -->
      <rect x="610" y="130" width="374" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="636" cy="160" r="14" fill="#D1FAE5"/>
      <text x="630" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#059669">💰</text>
      <text x="660" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Monthly Student Stipend</text>
      <text x="660" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Allowance · Oct 20</text>
      <text x="960" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669" font-weight="700" text-anchor="end">+₱3,500.00</text>

      <!-- Item 3 -->
      <rect x="610" y="200" width="374" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="636" cy="230" r="14" fill="#FEE2E2"/>
      <text x="630" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#DC2626">📚</text>
      <text x="660" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Database Reference Manual</text>
      <text x="660" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">DNSC Books · Oct 18</text>
      <text x="960" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#DC2626" font-weight="700" text-anchor="end">-₱420.00</text>

      <!-- Item 4 -->
      <rect x="610" y="270" width="374" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="636" cy="300" r="14" fill="#E0F2FE"/>
      <text x="630" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0284C7">🚌</text>
      <text x="660" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Campus Transport Card</text>
      <text x="660" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Panabo Transit · Oct 16</text>
      <text x="960" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#DC2626" font-weight="700" text-anchor="end">-₱180.00</text>
    </g>
  </g>

  <!-- Clear replacement label -->
  <g transform="translate(60, 715)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#047857" font-weight="500">PennyWise – Personal Expense Tracker · Deployed on Vercel · Upload screenshot to public/images/projects/pennywise.webp</text>
  </g>
</svg>
