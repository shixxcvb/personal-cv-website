      <rect x="0" y="0" width="560" height="370" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0F172A" font-weight="700">Expense Distribution</text>
      <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Categorized academic and personal living expenses</text>

      <!-- Bar Chart -->
      <g transform="translate(30, 80)">
        <!-- Bar 1: Tuition & School -->
        <rect x="20" y="80" width="50" height="180" rx="6" fill="#7C3AED"/>
        <text x="45" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4C1D95" text-anchor="middle" font-weight="600">₱4.2k</text>
        <text x="45" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Academic</text>

