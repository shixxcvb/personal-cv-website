        <text x="145" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46" text-anchor="middle" font-weight="600">₱2.8k</text>
        <text x="145" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Food</text>

