      <rect x="692" y="0" width="316" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="716" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" font-weight="500">IT Thesis &amp; Equipment Fund</text>
      <text x="716" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#0F172A" font-weight="800">₱16,430.00</text>
      <text x="716" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7C3AED" font-weight="600">82% of target goal reached</text>
    </g>

