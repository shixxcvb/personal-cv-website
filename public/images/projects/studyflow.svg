    <rect x="580" y="185" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
    <circle cx="605" cy="208" r="8" fill="#9333EA"/>
    <text x="625" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1E1B4B" font-weight="600">Prepare DNSC Laboratory Documentation</text>
    <text x="965" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7E22CE" font-weight="600">High</text>

    <rect x="580" y="240" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
    <circle cx="605" cy="263" r="8" fill="#D8B4FE"/>
    <text x="625" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1E1B4B" font-weight="600">Review Responsive CSS Flexbox &amp; Grid</text>
    <text x="955" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280" font-weight="500">Medium</text>

    <rect x="580" y="295" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
    <circle cx="605" cy="318" r="8" fill="#D8B4FE"/>
    <text x="625" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1E1B4B" font-weight="600">Configure Vercel Deployment Scripts</text>
    <text x="955" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280" font-weight="500">Medium</text>

    <rect x="580" y="350" width="440" height="34" rx="8" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="750" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7E22CE" font-weight="600">+ Add New Study Task</text>

