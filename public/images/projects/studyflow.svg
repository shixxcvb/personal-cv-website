<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="shadowFlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#581C87" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#flowGrad)"/>
  
  <!-- Browser Frame -->
  <g transform="translate(60, 45)" filter="url(#shadowFlow)">
    <rect width="1080" height="660" rx="16" fill="#FFFFFF"/>
    
    <!-- Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1064 0 C 1072.84 0 1080 7.16 1080 16 L 1080 48 L 0 48 Z" fill="#F5F3FF"/>
    <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="24" r="6" fill="#27C93F"/>
    
    <!-- URL -->
    <rect x="120" y="10" width="840" height="28" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
    <circle cx="140" cy="24" r="4" fill="#9333EA"/>
    <text x="156" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#581C87" font-weight="500">https://study-flow-emf5.vercel.app</text>
    <text x="920" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7E22CE">GitHub Verified</text>

    <!-- App Nav -->
    <rect x="0" y="48" width="1080" height="60" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="1"/>
    <circle cx="48" cy="78" r="14" fill="#9333EA"/>
    <path d="M 44 73 L 53 78 L 44 83 Z" fill="#FFFFFF"/>
    <text x="74" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#1E1B4B" font-weight="700">Study<tspan fill="#9333EA">Flow</tspan></text>
    
    <text x="240" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9333EA" font-weight="600">Focus Timer</text>
    <rect x="238" y="96" width="68" height="3" rx="1.5" fill="#9333EA"/>
    <text x="340" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280" font-weight="500">Task Board</text>
    <text x="450" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280" font-weight="500">Calendar</text>
    <text x="550" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B7280" font-weight="500">Analytics</text>
    
    <rect x="910" y="62" width="140" height="32" rx="16" fill="#F3E8FF"/>
    <text x="932" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7E22CE" font-weight="600">Streak: 7 Days 🔥</text>

    <!-- Focus Centerpiece -->
    <rect x="36" y="128" width="500" height="495" rx="12" fill="#FAF5FF" stroke="#F3E8FF" stroke-width="1"/>
    <text x="60" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#1E1B4B" font-weight="700">Pomodoro Focus Session</text>
    <text x="60" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">Current Task: IT4B Advanced Web Systems Review</text>

