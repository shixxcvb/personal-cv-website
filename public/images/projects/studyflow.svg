      <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">MON</text>
      <text x="21" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">19</text>

      <rect x="64" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="82" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">TUE</text>
      <text x="83" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">20</text>

      <rect x="128" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="144" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">WED</text>
      <text x="147" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">21</text>

      <rect x="192" y="0" width="56" height="60" rx="8" fill="#9333EA"/>
      <text x="209" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E9D5FF" font-weight="bold">THU</text>
      <text x="211" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" font-weight="800">22</text>

      <rect x="256" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="275" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">FRI</text>
      <text x="274" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">23</text>

      <rect x="320" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="339" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">SAT</text>
      <text x="338" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">24</text>

      <rect x="384" y="0" width="56" height="60" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="401" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">SUN</text>
      <text x="403" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1E1B4B" font-weight="700">25</text>
    </g>
    <text x="580" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7E22CE">Next up: 2-hour Group Review Session at 3:00 PM</text>
  </g>

  <!-- Clear replacement label -->
  <g transform="translate(60, 715)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B21A8" font-weight="500">StudyFlow – Student Productivity Planner · Deployed on Vercel · Upload screenshot to public/images/projects/studyflow.webp</text>
  </g>
</svg>
